name: test
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    # Public repository: GitHub-hosted runners cost nothing here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx oxlint
      - run: bun test ./test.js
